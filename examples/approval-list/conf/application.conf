# サンプル：たくさんの中から探す（N-3 / examples/approval-list）
#
# PostgreSQL 単独である。
#
# 起動:
#   ./gradlew :examples:approval-list:migrate
#   ./gradlew :examples:approval-list:codegen
#   ./gradlew :examples:approval-list:run
#
# このサンプルの staff はログインしない。だから password_hash が無い。
# approval-auth の staff とは列が違う（N-3 の 5.1）。

db {
	approval_list_example {
		main = true

		product = "postgresql"
		driver = "org.postgresql.Driver"

		url = "jdbc:postgresql://127.0.0.1:5432/approval_list_example"
		url = ${?JIMBLE_TEST_PG_URL}

		username = "jimble"
		username = ${?JIMBLE_TEST_PG_USER}

		password = "jimble"
		password = ${?JIMBLE_TEST_PG_PASSWORD}

		maximumPoolSize = 4
		minimumIdle = 1

		create_database_sql = "CREATE DATABASE approval_list_example"
	}
}

codegen {
	package = "db"
}

# 1ページの既定を変える（要件 F-V-06）。
# キー名そのものも変えられる（paging.page / paging.per）が、
# ここでは既定の page / per のままにしてある
paging {
	page = "page"
	per = "per"
}

sql_cache {
	# 既定は false。このサンプルは「更新したら勝手に消える」ところを見せるので有効にする
	enabled = true

	# 1台の中だけ。複数台で動かすなら redis か db（要件 F-D-28）
	store = "memory"

	ttl = 300
}

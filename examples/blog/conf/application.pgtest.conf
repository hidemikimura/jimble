# PostgreSQL でサンプルアプリを動かすときの設定（要件 F-D-30 / F-G-20）
#
# application.conf との違いは、繋ぎ先と product だけである。
# アプリのコードもテストのコードも1行も変わらない。
# 流れるマイグレーションだけが、ファイル名の接尾辞で入れ替わる
#   conf/migration/blog_example/001_create_post.postgresql.sql
#
#   JIMBLE_TEST_PG_URL / JIMBLE_TEST_PG_USER / JIMBLE_TEST_PG_PASSWORD
#
# 実行:
#   ./gradlew :examples:blog:pgTest
#
# 環境はシステムプロパティで決まる（D-78）。アプリの引数では変わらない。
#   java -Djimble.env=pgtest -jar app.jar

# 環境別ファイルは application.conf を「置き換える」。
# これを書き忘れると codegen も Cookie もバッチ管理画面も設定ごと消える（D-80）
include "application.conf"

db {
	blog_example {
		product = "postgresql"
		driver = "org.postgresql.Driver"

		url = "jdbc:postgresql://127.0.0.1:5432/blog_example"
		url = ${?JIMBLE_TEST_PG_URL}

		username = "jimble"
		username = ${?JIMBLE_TEST_PG_USER}

		password = "jimble"
		password = ${?JIMBLE_TEST_PG_PASSWORD}

		create_database_sql = "CREATE DATABASE blog_example"
	}
}

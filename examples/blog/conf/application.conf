# サンプルアプリの設定
#
# 接続先は環境変数で上書きできる。
#   JIMBLE_SAMPLE_DB_URL / JIMBLE_SAMPLE_DB_USER / JIMBLE_SAMPLE_DB_PASSWORD

db {
	blog_example {
		main = true
		driver = "org.mariadb.jdbc.Driver"

		# 接続先は JIMBLE_SAMPLE_DB_* で差し替えられる。
		#
		# JIMBLE_TEST_DB_* ではない。あちらは jimble 本体のテスト用
		# （jimble_test）で、開発者が dbTest / pgTest の接続先を替えるために立てる。
		# サンプルが同じ名前を見ていると、その環境変数を立てた瞬間に
		# サンプルのマイグレーションが jimble_test へ流れ込み、
		# 履歴が混ざって jimble 本体のマイグレーションテストが落ちる（D-138）。
		url = "jdbc:mariadb://127.0.0.1:3306/blog_example?permitMysqlScheme=&useUnicode=true&characterEncoding=UTF-8&characterSetResults=UTF-8&connectionCollation=utf8mb4_bin&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true"
		url = ${?JIMBLE_SAMPLE_DB_URL}

		username = "jimble"
		username = ${?JIMBLE_SAMPLE_DB_USER}

		password = "jimble"
		password = ${?JIMBLE_SAMPLE_DB_PASSWORD}

		maximum_pool_size = 4
		minimum_idle = 1
		connection_timeout = 3s
		connection_pool_type = "hikari"

		create_database_sql = "CREATE SCHEMA blog_example COLLATE utf8mb4_bin"
	}
}

codegen {
	package = "db"

	# MQ のテーブルは名前をアプリが決めるので（要件 F-M-03）、
	# jimble 側の除外リストには入らない。使わないなら外す。
	exclude_tables = ["mq_blog", "mq_scheduler"]
}

# バッチ管理画面（要件 F-B-11）
#
# ユーザー名かパスワードが空だと組み込まれない。
# 本番では必ず環境変数で渡す。サンプルのパスワードは application.local.conf にある（D-254）
batch_manager {
	enabled  = true
	username = "admin"
	username = ${?BLOG_BATCH_MANAGER_USER}
	password = ${?BLOG_BATCH_MANAGER_PASSWORD}
}

# Cookie（要件 F-S-05 / NF-S-04）
#
# 既定は secure = true（HTTPS のみ）である。ローカルは http なので、
# application.local.conf で false にしている（本番はこのファイルのまま true）。
cookie {
	#
	# 署名鍵。これが空だと、Cookie の署名が丸ごと効かない。
	# セッション ID も CSRF トークンも改ざんを検知できなくなるが、
	# 例外は出ず、Cookie は普通に読み書きできるので気づけない
	# （起動時に警告が出る）。
	#
	# 本番では環境変数から渡すこと。サンプルの鍵は application.local.conf にある（D-254）。
	# かつてはここにサンプルの鍵を書いていたので、渡し忘れると、公開されている鍵で動いた。
	#
	secret = ${?COOKIE_SECRET}

	#
	# 鍵を入れ替えるときだけ、いままでの鍵をここに残す。
	# 入れ替えが終わったら消すこと（残したままだと古い鍵で読めてしまう）。
	#
	previous_secrets = [${?COOKIE_SECRET_OLD}]
}

# サンプルは、この機械の中からだけ受ける（D-254）。
#
# サンプルには、認証の無い書き込みの API がある（それぞれの題材に絞るため。認証は approval-auth を見ること）。
# 既定（""）のままだと、同じネットワークのほかの機械から書き込める。
# ほかの機械から試すなら、"" にする前に、ルートに認証を付けること
server.host = "127.0.0.1"

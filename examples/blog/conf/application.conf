# サンプルアプリの設定
#
# 接続先は環境変数で上書きできる。
#   JIMBLE_TEST_DB_URL / JIMBLE_TEST_DB_USER / JIMBLE_TEST_DB_PASSWORD

db {
	blog_example {
		main = true
		driver = "org.mariadb.jdbc.Driver"

		url = "jdbc:mariadb://127.0.0.1:3306/blog_example?permitMysqlScheme=&useUnicode=true&characterEncoding=UTF-8&characterSetResults=UTF-8&connectionCollation=utf8mb4_bin&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true"
		url = ${?JIMBLE_TEST_DB_URL}

		username = "jimble"
		username = ${?JIMBLE_TEST_DB_USER}

		password = "jimble"
		password = ${?JIMBLE_TEST_DB_PASSWORD}

		maximumPoolSize = 4
		minimumIdle = 1
		connectionTimeout = 3000
		connection_pool_type = "hikari"

		create_database_sql = "CREATE SCHEMA blog_example COLLATE utf8mb4_bin"
	}
}

codegen {
	package = "db"

	# MQ のテーブルは名前をアプリが決めるので（要件 F-M-03）、
	# jimble 側の除外リストには入らない。使わないなら外す。
	exclude_tables = ["mq_blog", "mq_scheduler"]
}

# バッチ管理画面（要件 F-B-11）
#
# ユーザー名かパスワードが空だと組み込まれない。
# 本番では必ず環境変数で渡す。
batch_manager {
	enabled  = true
	username = "admin"
	username = ${?BLOG_BATCH_MANAGER_USER}
	password = "blog-admin"
	password = ${?BLOG_BATCH_MANAGER_PASSWORD}
}

# Cookie（要件 F-S-05 / NF-S-04）
#
# 既定は secure = true（HTTPS のみ）である。安全側が既定なのは正しいが、
# ローカルは http なので、そのままだとブラウザが Cookie を送り返さない。
# セッションも CSRF も「エラーも出ずに効かない」形になる。
# 本番では必ず true に戻すこと（この行を消せばよい）。
cookie {
	secure = false

	#
	# 署名鍵。これが空だと、Cookie の署名が丸ごと効かない。
	# セッション ID も CSRF トークンも改ざんを検知できなくなるが、
	# 例外は出ず、Cookie は普通に読み書きできるので気づけない
	# （起動時に警告が出る）。
	#
	# ここに直接書いているのは、これがサンプルだからである。
	# 本番では環境変数から渡すこと（下の行が上書きする）。
	#
	secret = "blog-example-cookie-secret-do-not-use-in-production"
	secret = ${?COOKIE_SECRET}

	#
	# 鍵を入れ替えるときだけ、いままでの鍵をここに残す。
	# 入れ替えが終わったら消すこと（残したままだと古い鍵で読めてしまう）。
	#
	previous_secrets = [${?COOKIE_SECRET_OLD}]
}

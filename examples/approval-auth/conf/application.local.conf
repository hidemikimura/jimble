include "application.conf"

# ローカル（-Djimble.env=local。既定の環境）とテストだけで使う設定（D-254）
#
# サンプルの鍵は<b>公開されている</b>ので、application.conf には書かない。
# かつては application.conf に書き、環境変数で上書きしていたので、
# 環境変数を渡し忘れた本番は、誰でも知っている鍵で動いた（Cookie を作れる、二要素の秘密鍵を戻せる）。
# 本番の環境（application.production.conf など）には、ここの内容を写さないこと。

cookie {
	# ローカルは http なので、HTTPS のみの Cookie はブラウザが送り返さない
	secure = false

	secret = "approval-auth-sample-cookie-secret-0001"

	# 鍵の入れ替えのテストで使う
	previous_secrets = ["approval-auth-sample-cookie-secret-0000"]
}

auth.mfa.secret_key = "approval-auth-sample-mfa-secret-key"

# パスキー（D-261）。手元は localhost（ブラウザは localhost だけ http でパスキーを使わせる）。
# http://127.0.0.1:9000 ではなく http://localhost:9000 で開くこと（オリジンが違うと断る）
auth.passkey {
	rp_id   = "localhost"
	rp_name = "承認ワークフロー（サンプル）"
	origins = ["http://localhost:9000"]
}

# pgTest 用（./gradlew :examples:approval-auth:pgTest）
#
# このサンプルはもともと PostgreSQL なので、application.conf との違いは
# 接続先を JIMBLE_TEST_PG_* で差し替えられることだけである。
#
# それでもこのファイルを置いているのは、pgTest が
# 「application.pgtest.conf があるモジュールだけ走る」という作りだからである。
# 置かないと、このサンプルの結合テストは CI で一度も走らない。

# 環境別ファイルは application.conf を「置き換える」。
# include を書き忘れると codegen も session も cookie も設定ごと消える（D-80）
include "application.conf"

# サンプル：誰が入れるか（N-3 / examples/approval-auth）
#
# このサンプルは PostgreSQL 単独である。MySQL 版のマイグレーションは持たない。
# 方言の両対応は examples/blog と jimble-db のテストが担保している。
#
# 起動:
#   ./gradlew :examples:approval-auth:migrate
#   ./gradlew :examples:approval-auth:codegen
#   ./gradlew :examples:approval-auth:run
#
# ログインできる人はマイグレーション 002_seed.sql に書いてある。

db {
	approval_auth_example {
		main = true

		product = "postgresql"
		driver = "org.postgresql.Driver"

		# 接続先は JIMBLE_SAMPLE_PG_* で差し替えられる。
		#
		# JIMBLE_TEST_PG_* ではない。あちらは jimble 本体のテスト用
		# （jimble_test）で、開発者が dbTest / pgTest の接続先を替えるために立てる。
		# サンプルが同じ名前を見ていると、その環境変数を立てた瞬間に
		# サンプルのマイグレーションが jimble_test へ流れ込み、
		# 履歴が混ざって jimble 本体のマイグレーションテストが落ちる（D-138）。
		url = "jdbc:postgresql://127.0.0.1:5432/approval_auth_example"
		url = ${?JIMBLE_SAMPLE_PG_URL}

		username = "jimble"
		username = ${?JIMBLE_SAMPLE_PG_USER}

		password = "jimble"
		password = ${?JIMBLE_SAMPLE_PG_PASSWORD}

		maximumPoolSize = 4
		minimumIdle = 1

		create_database_sql = "CREATE DATABASE approval_auth_example"
	}
}

codegen {
	package = "db"

	# jimble が自分で作るテーブルは生成しない
	exclude_tables = ["session"]
}

session {
	# DB セッション（要件 F-S-01）。テーブルは初回アクセスのときに作られる
	store = "db"

	# 30分（要件 F-S-01）
	timeout_minutes = 30
}

cookie {
	# ローカルは http なので既定を落としている。本番では戻すこと
	secure = false

	# サンプルなので直書きしている。本物のアプリでは環境変数から入れること
	secret = "approval-auth-sample-cookie-secret-0001"
	secret = ${?COOKIE_SECRET}

	# 鍵の入れ替え（要件 NF-S-09 / D-128）。
	# secret を新しくして、いままでの鍵をここへ移すと、誰もログアウトしない
	previous_secrets = ["approval-auth-sample-cookie-secret-0000"]
}

auth {
	mfa {
		# 二要素認証（要件 F-W-32）。テーブルは初回に作られる
		enabled = true

		# 認証アプリの一覧に出る名前
		issuer = "approval-auth"

		# パスワードが通ってからコードを入れるまでの猶予（秒）
		pending_seconds = 300

		# 秘密鍵を暗号化する鍵（要件 F-W-32 / D-153）。
		#
		# これが無いと Mfa.enroll は例外を投げて断る。
		# 秘密鍵を平文で持つと、DB が漏れた時点で全員の二要素が突破される——
		# パスワードのハッシュと違い、TOTP の秘密鍵は破る手間がゼロである。
		#
		# cipher.key を流用しないこと（D-154）。
		# hash.password.encrypt の既定は「cipher.key があれば true」なので、
		# 平文の BCrypt を保存しているアプリが cipher.key を足すと、
		# 保存済みのハッシュが「暗号化済み」として読まれ、全員ログインできなくなる。
		# このサンプルで実際に起きた（二要素と関係のないテストが16本落ちた）。
		#
		# サンプルなので直書きしている。本物のアプリでは環境変数から入れること。
		secret_key = "approval-auth-sample-mfa-secret-key"
		secret_key = ${?MFA_SECRET_KEY}
	}
}

hash {
	password {
		# パスワードハッシュの pepper（要件 F-Y-10）。サンプルなので直書き
		pepper = "approval-auth-sample-pepper"
	}
}

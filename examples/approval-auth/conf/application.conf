# サンプル：誰が入れるか（N-3 / examples/approval-auth）
#
# このサンプルは PostgreSQL 単独である。MySQL 版のマイグレーションは持たない。
# 方言の両対応は examples/blog と jimble-db のテストが担保している。
#
# 起動:
#   ./gradlew :examples:approval-auth:migrate
#   ./gradlew :examples:approval-auth:codegen
#   ./gradlew :examples:approval-auth:run
#
# ログインできる人はマイグレーション 002_seed.sql に書いてある。

db {
	approval_auth_example {
		main = true

		product = "postgresql"
		driver = "org.postgresql.Driver"

		url = "jdbc:postgresql://127.0.0.1:5432/approval_auth_example"
		url = ${?JIMBLE_TEST_PG_URL}

		username = "jimble"
		username = ${?JIMBLE_TEST_PG_USER}

		password = "jimble"
		password = ${?JIMBLE_TEST_PG_PASSWORD}

		maximumPoolSize = 4
		minimumIdle = 1

		create_database_sql = "CREATE DATABASE approval_auth_example"
	}
}

codegen {
	package = "db"

	# jimble が自分で作るテーブルは生成しない
	exclude_tables = ["session"]
}

session {
	# DB セッション（要件 F-S-01）。テーブルは初回アクセスのときに作られる
	store = "db"

	# 30分（要件 F-S-01）
	timeout_minutes = 30
}

cookie {
	# ローカルは http なので既定を落としている。本番では戻すこと
	secure = false

	# サンプルなので直書きしている。本物のアプリでは環境変数から入れること
	secret = "approval-auth-sample-cookie-secret-0001"
	secret = ${?COOKIE_SECRET}

	# 鍵の入れ替え（要件 NF-S-09 / D-128）。
	# secret を新しくして、いままでの鍵をここへ移すと、誰もログアウトしない
	previous_secrets = ["approval-auth-sample-cookie-secret-0000"]
}

hash {
	password {
		# パスワードハッシュの pepper（要件 F-Y-10）。サンプルなので直書き
		pepper = "approval-auth-sample-pepper"
	}
}

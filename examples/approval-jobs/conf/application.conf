# サンプル：時間のかかる仕事（N-3 / examples/approval-jobs）
#
# PostgreSQL 単独である。
#
# 入口が3つある。どれも Bootstrap.load() で同じものを用意する。
#   ./gradlew :examples:approval-jobs:migrate
#   ./gradlew :examples:approval-jobs:codegen
#   ./gradlew :examples:approval-jobs:run                        # Web（管理画面と手で触る口）
#   java -cp app.jar approval.jobs.JobsBatch     env=local class=approval.jobs.batch.ReminderBatch
#   java -cp app.jar approval.jobs.JobsScheduler env=local       # cron と MQ のワーカー
#
# このサンプルの request は「締切バッチが拾うもの」しか持たない。
# 他のサンプルの同名テーブルとは列が違う（N-3 の 5.1）。

db {
	approval_jobs_example {
		main = true

		product = "postgresql"
		driver = "org.postgresql.Driver"

		# 接続先は JIMBLE_SAMPLE_PG_* で差し替えられる。
		#
		# JIMBLE_TEST_PG_* ではない。あちらは jimble 本体のテスト用
		# （jimble_test）で、開発者が dbTest / pgTest の接続先を替えるために立てる。
		# サンプルが同じ名前を見ていると、その環境変数を立てた瞬間に
		# サンプルのマイグレーションが jimble_test へ流れ込み、
		# 履歴が混ざって jimble 本体のマイグレーションテストが落ちる（D-138）。
		url = "jdbc:postgresql://127.0.0.1:5432/approval_jobs_example"
		url = ${?JIMBLE_SAMPLE_PG_URL}

		username = "jimble"
		username = ${?JIMBLE_SAMPLE_PG_USER}

		password = "jimble"
		password = ${?JIMBLE_SAMPLE_PG_PASSWORD}

		# ワーカーが実行種別ごとに立つので、blog より少し多めに要る
		maximumPoolSize = 8
		minimumIdle = 1

		create_database_sql = "CREATE DATABASE approval_jobs_example"
	}
}

codegen {
	package = "db"

	# MQ とスケジューラのテーブルは jimble のものだが、
	# 名前をアプリが決めるので jimble 側の除外一覧に入らない。
	# 書かないと、キューのテーブル定義クラスが生成される
	exclude_tables = ["mq_notice", "mq_scheduler"]
}

batch {
	# 中断指示を見にいく間隔。既定は 3 秒
	cancel_check_seconds = 3

	# チャンクバッチが進み具合を batch_history に書く間隔（要件 F-B-12 / D-137）。
	# 既定は 5 秒。ここでは「走っている最中に見える」ことを短時間で確かめたいので短くしてある
	progress_seconds = 2
}

mq {
	# やり直しの間隔。10 → 20 → 40 …（上限まで）と倍々になる。
	#
	# 既定は 10 秒／上限 600 秒である。
	# サンプルは「手で動かして、リトライが起きるのを目で見る」ためのものなので、
	# 待たされすぎない値にしてある。本番でここまで短くする理由はない
	retry_backoff_seconds = 5
	retry_backoff_max_seconds = 30

	# 実行種別ごとのスレッド数（要件 F-M-08）。
	# 書かなければ種別ごとの既定が使われる。
	# long_time は既定 8 だが、このサンプルは1台で動かすので絞ってある
	thread_count {
		long_time = 2
	}
}

scheduler {
	# cron を見にいく間隔。既定は 1 秒
	tick_interval_ms = 1000
}

batch_manager {
	# 既定は false。利用者名かパスワードが空だと画面そのものが生えない
	enabled  = true
	username = "admin"
	username = ${?APPROVAL_JOBS_BATCH_MANAGER_USER}

	# サンプル用の固定値である。本番では設定か環境変数から入れること
	password = "jobs-admin"
	password = ${?APPROVAL_JOBS_BATCH_MANAGER_PASSWORD}
}

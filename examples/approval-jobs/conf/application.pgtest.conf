# pgTest 用（./gradlew :examples:approval-jobs:pgTest）
#
# もともと PostgreSQL なので、違いは接続先を JIMBLE_SAMPLE_PG_* で
# 差し替えられることだけである。
# それでも置いているのは、pgTest が
# 「application.pgtest.conf があるモジュールだけ走る」作りだからである。

include "application.conf"

mq {
	# テストは「リトライされて、最後に dead になる」ところまで待つ。
	#
	# 既定（10 → 20 → 40 …）だと3回やり直すだけで1分を超える。
	# 待ち時間そのものは jimble-mq のテストで確かめているので、
	# ここでは縮めてよい
	poll_min = 5ms
	poll_max = 50ms
	retry_backoff = 1s
	retry_backoff_max = 2s
	stale = 2s
}

batch {
	# 進み具合が「走っている最中に」見えることを確かめる。
	# 0 にするとチャンクごとに毎回書く
	progress = 0s
}

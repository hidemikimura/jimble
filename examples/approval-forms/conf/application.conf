# サンプル：入力を確かめる（N-3 / examples/approval-forms）
#
# PostgreSQL 単独である。MySQL 版のマイグレーションは持たない。
#
# 起動:
#   ./gradlew :examples:approval-forms:migrate
#   ./gradlew :examples:approval-forms:codegen
#   ./gradlew :examples:approval-forms:run
#
# このサンプルには staff も department も無い。
# 主題は「入力を確かめる」ことなので、申請そのものと明細と添付だけを持つ。

db {
	approval_forms_example {
		main = true

		product = "postgresql"
		driver = "org.postgresql.Driver"

		url = "jdbc:postgresql://127.0.0.1:5432/approval_forms_example"
		url = ${?JIMBLE_TEST_PG_URL}

		username = "jimble"
		username = ${?JIMBLE_TEST_PG_USER}

		password = "jimble"
		password = ${?JIMBLE_TEST_PG_PASSWORD}

		maximumPoolSize = 4
		minimumIdle = 1

		create_database_sql = "CREATE DATABASE approval_forms_example"
	}
}

codegen {
	package = "db"
}

cookie {
	# ローカルは http なので既定を落としている。本番では戻すこと
	secure = false

	# サンプルなので直書きしている
	secret = "approval-forms-sample-cookie-secret"
	secret = ${?COOKIE_SECRET}
}

upload {
	# 添付は小さいものだけ（既定は 10MB）。サンプルなので絞ってある
	max_file_size = 1048576
}

# サンプル：入力を確かめる（N-3 / examples/approval-forms）
#
# PostgreSQL 単独である。MySQL 版のマイグレーションは持たない。
#
# 起動:
#   ./gradlew :examples:approval-forms:migrate
#   ./gradlew :examples:approval-forms:codegen
#   ./gradlew :examples:approval-forms:run
#
# このサンプルには staff も department も無い。
# 主題は「入力を確かめる」ことなので、申請そのものと明細と添付だけを持つ。

db {
	approval_forms_example {
		main = true

		product = "postgresql"
		driver = "org.postgresql.Driver"

		# 接続先は JIMBLE_SAMPLE_PG_* で差し替えられる。
		#
		# JIMBLE_TEST_PG_* ではない。あちらは jimble 本体のテスト用
		# （jimble_test）で、開発者が dbTest / pgTest の接続先を替えるために立てる。
		# サンプルが同じ名前を見ていると、その環境変数を立てた瞬間に
		# サンプルのマイグレーションが jimble_test へ流れ込み、
		# 履歴が混ざって jimble 本体のマイグレーションテストが落ちる（D-138）。
		url = "jdbc:postgresql://127.0.0.1:5432/approval_forms_example"
		url = ${?JIMBLE_SAMPLE_PG_URL}

		username = "jimble"
		username = ${?JIMBLE_SAMPLE_PG_USER}

		password = "jimble"
		password = ${?JIMBLE_SAMPLE_PG_PASSWORD}

		maximum_pool_size = 4
		minimum_idle = 1

		create_database_sql = "CREATE DATABASE approval_forms_example"
	}
}

codegen {
	package = "db"
}

cookie {
	# 署名鍵は環境変数から入れる。サンプルの鍵（と secure = false）は application.local.conf にある（D-254）
	secret = ${?COOKIE_SECRET}
}

upload {
	# 添付は小さいものだけ（既定は 10MiB）。サンプルなので絞ってある
	max_file_size = 1MB
}

# サンプルは、この機械の中からだけ受ける（D-254）。
#
# サンプルには、認証の無い書き込みの API がある（それぞれの題材に絞るため。認証は approval-auth を見ること）。
# 既定（""）のままだと、同じネットワークのほかの機械から書き込める。
# ほかの機械から試すなら、"" にする前に、ルートに認証を付けること
server.host = "127.0.0.1"

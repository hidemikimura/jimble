include "application.conf"

# ローカル（-Djimble.env=local。既定の環境）とテストだけで使う設定（D-254）
#
# サンプルの鍵は公開されているので、application.conf には書かない。
# 本番の環境（application.production.conf など）には、ここの内容を写さないこと。

cookie {
	# ローカルは http なので、HTTPS のみの Cookie はブラウザが送り返さない
	secure = false

	secret = "approval-forms-sample-cookie-secret"
}

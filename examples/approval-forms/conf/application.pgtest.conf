# pgTest 用（./gradlew :examples:approval-forms:pgTest）
#
# もともと PostgreSQL なので、application.conf との違いは
# 接続先を JIMBLE_SAMPLE_PG_* で差し替えられることだけである。
# それでも置いているのは、pgTest が
# 「application.pgtest.conf があるモジュールだけ走る」作りだからである。

# サンプルの鍵（cookie.secret など）は application.local.conf にあるので、そちらを読む（D-254）
include "application.local.conf"

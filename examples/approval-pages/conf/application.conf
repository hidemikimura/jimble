# サンプル：画面を返す（N-3 / examples/approval-pages）
#
# DB を使わない。そのまま起動できる。
#
#   ./gradlew :examples:approval-pages:run
#
# 見るところ:
#   http://localhost:9000/               jte のレイアウトを使った画面
#   http://localhost:9000/requests       同じレイアウトの2枚目
#   http://localhost:9000/assets/app.css 静的配信（Etag つき）
#   http://localhost:9000/app/items/1    SPA（title が差し替わる）
#   http://localhost:9000/guide/         MPA
#   http://localhost:9000/api/echo       別ポートへ転送

server {
	# 一生呼ばれないルートがあったら起動を止める（要件 F-R-13 / D-10）。
	#
	# 静的配信・SPA・MPA・プロキシは <b>それぞれワイルドカードを登録する</b>ので、
	# 書き方を間違えるとお互いを食い合う。それを起動時に見つけたい
	strict_routes = true
}

assets {
	# 変わりうるファイルの max-age（秒）。既定は 0。
	#
	# 0 でも Cache-Control は付く（public,max-age=0,must-revalidate）ので、
	# ブラウザは毎回聞きに来て、変わっていなければ 304 が返る
	max_age = 0s
	# .js / .css / .woff / .woff2 の max-age（秒）。既定は 31536000（1年）。
	#
	# <b>拡張子だけで判断している。</b>app.css を書き換えても、
	# ブラウザは1年間取りに来ない。
	# ファイル名にハッシュを入れる（app.8f3a1c.css）のが本筋だが、
	# サンプルは書き換えて確かめたいので短くしてある
	immutable_max_age = 1m
	# ETag を使うか（既定 true）
	etag = true

	# If-Modified-Since を見るか（既定 true）
	if_modified_since = true
}

proxy {
	# 転送先に繋ぐまでの待ち（ミリ秒）。既定 5000
	connect_timeout = 5s

	# 転送先が返すまでの待ち（ミリ秒）。既定 30000
	request_timeout = 30s
}

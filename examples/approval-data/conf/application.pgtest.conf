# pgTest 用（./gradlew :examples:approval-data:pgTest）
#
# 違うのは Redis を書いていることだけである。
# 「設定を1行変えると Redis」（要件 F-U-10）を、テストで実際に通すために書く。

include "application.conf"

# 分散ロック（要件 F-U-09）を Redis で試すために書く。
# CI の pg ジョブには Redis が立っている
redis {
	host = "127.0.0.1"
	host = ${?JIMBLE_TEST_REDIS_HOST}
	port = 6379
}

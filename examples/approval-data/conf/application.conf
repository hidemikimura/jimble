# サンプル：DB の込み入った話（N-3 / examples/approval-data）
#
# PostgreSQL 単独。ただし <b>データベースは2つ</b>使う。
#
#   ./gradlew :examples:approval-data:migrate    # 2つとも当たる
#   ./gradlew :examples:approval-data:codegen    # 2つぶん生成される
#   ./gradlew :examples:approval-data:run
#
# 「サブ DB」には2つの意味がある。このファイルは<b>両方書いてある</b>。
#
#   1. トップレベルの db { } をもう1本   … 別のデータソース。DBUtil.getDB("名前")
#   2. 親の subs { } にぶら下げる         … db.newSubDB("名前")
#
# <b>2 にはマイグレーションも codegen も当たらない。</b>
# データソースごとの処理はトップレベルの db { } しか回らないためである。
# 監査ログは表も型も要るので 1 にしてある。

db {
	approval_data_example {
		main = true

		product = "postgresql"
		driver = "org.postgresql.Driver"

		# 接続先は JIMBLE_SAMPLE_PG_* で差し替えられる。
		#
		# JIMBLE_TEST_PG_* ではない（D-138）。あちらは jimble 本体のテスト用である。
		url = "jdbc:postgresql://127.0.0.1:5432/approval_data_example"
		url = ${?JIMBLE_SAMPLE_PG_URL}

		username = "jimble"
		username = ${?JIMBLE_SAMPLE_PG_USER}

		password = "jimble"
		password = ${?JIMBLE_SAMPLE_PG_PASSWORD}

		maximum_pool_size = 4
		minimum_idle = 1

		create_database_sql = "CREATE DATABASE approval_data_example"

		# 参照用の接続（要件 F-D-13）。
		#
		# 本番ではここにレプリカを書く。<b>このサンプルは同じ DB を指している。</b>
		# 分けたことで何が変わるかは、それでも見える——
		#
		#   - 参照は read 側の接続を使うようになる
		#   - 書いた直後の SELECT は書込側へ回る（sticky。要件 F-D-19）
		#   - sticky の間は SQL 結果キャッシュも読まなくなる
		#
		# read を1行も書かなければ、これらは全部起きない
		# （getReadDataSource() が書込側を返すだけになる）。
		read {
			url = "jdbc:postgresql://127.0.0.1:5432/approval_data_example"
			url = ${?JIMBLE_SAMPLE_PG_URL}

			maximum_pool_size = 2
			minimum_idle = 1
		}

		# ぶら下がるサブ DB（要件 F-D-14）。
		#
		# <b>接続もトランザクションも共有しない。</b>別のプールである。
		# db.newSubDB("scratch") で取る。
		#
		# <b>マイグレーションは当たらない。</b>だからここには
		# 「アプリが自分で作る作業用テーブル」しか置けない。
		# 表と型が要るもの（監査ログ）は、下のトップレベル2本目にしてある。
		#
		# <b>ここは同じデータベースを指している。</b>それでも接続は別である——
		# 「別のサーバーだから共有できない」のではなく、<b>そもそも共有しない</b>
		# ことが、同じ DB を指していれば嫌でも分かる。
		#
		# 別のデータベースを指すこともできるが、そのときは
		# <b>そのデータベースが先に在ること</b>。subs は親のデータソースを作る途中で
		# 繋ぎにいくので、あとに書いたトップレベルの create_database_sql は間に合わない。
		subs {
			scratch {
				url = "jdbc:postgresql://127.0.0.1:5432/approval_data_example"
				url = ${?JIMBLE_SAMPLE_PG_URL}

				maximum_pool_size = 2
				minimum_idle = 1
			}
		}
	}
}

db {
	# 監査ログ（要件 F-D-14 / F-G-09）。
	#
	# トップレベルなので、
	#   - conf/migration/approval_data_audit_example/ のマイグレーションが当たる
	#   - codegen が db/approval_data_audit_example/ を作る
	#   - migration / db_lock / db_value / db_cache もこちらに作られる
	#
	# main = true は付けない。付けるとメインが入れ替わる
	approval_data_audit_example {
		product = "postgresql"
		driver = "org.postgresql.Driver"

		url = "jdbc:postgresql://127.0.0.1:5432/approval_data_audit_example"
		url = ${?JIMBLE_SAMPLE_PG_AUDIT_URL}

		username = "jimble"
		username = ${?JIMBLE_SAMPLE_PG_USER}

		password = "jimble"
		password = ${?JIMBLE_SAMPLE_PG_PASSWORD}

		maximum_pool_size = 2
		minimum_idle = 1

		create_database_sql = "CREATE DATABASE approval_data_audit_example"
	}
}

codegen {
	package = "db"
}

cache {
	# db / memory / redis（要件 F-U-07 / F-U-08）。既定は db。
	#
	# <b>この1行を redis に変えるだけで置き場が変わる。</b>アプリのコードは1行も変わらない。
	# ただし redis.host を書いていないと、キャッシュを使ったところで例外になる
	# （「取れなかった」と「そもそも Redis が無い」を同じ扱いにしないため。要件 F-U-10）。
	# 起動時にもその組み合わせは警告される（要件 F-U-11）
	type = "db"
}

# Redis は書かない（要件 F-U-10）。
#
# 書かなければ DB キャッシュと DBLock で全部動く。
# 結合テストの側（application.pgtest.conf）にだけ書いて、
# 「1行変えると Redis」を実際に通している
#
# redis {
#   host = "127.0.0.1"
#   port = 6379
# }

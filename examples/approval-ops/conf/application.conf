# サンプル：動いている中を見る（N-3 / examples/approval-ops）
#
# DB を使わない。そのまま起動できる。
#
#   ./gradlew :examples:approval-ops:run
#
# 見るところ:
#   http://localhost:9000/health_check   止め始めたら 503 になる
#   http://localhost:9000/metrics        いまの数字
#   http://localhost:9000/limited        10秒に3回まで

server {
	# 一生呼ばれないルートがあったら起動を止める（要件 F-R-13 / D-10）。
	# 既定は警告だけだが、警告は起動ログの何十行にも紛れるので出しただけでは誰も見ない。
	# CI ではこちらにすること
	strict_routes = true

	# アクセスログ（要件 NF-O-02 / D-130）。
	#
	# 切ると 1リクエストの割り当てが4割ほど減るが、
	# あとから「あのとき何が起きたか」を調べる手段が無くなる。
	# ここは既定（true）のままにしてある。切るなら次のように書く
	#
	#   access_log = false
	#
	# 切ってもメトリクスとトレースは残る

	# ボットのアクセスログを access.bot へ分ける（要件 F-H-05）
	bot_access_log = true
}

rate_limit {
	# memory / redis / db（要件 F-R-15 / D-90）。
	# このサンプルは1台で動かすので memory。複数台なら redis か db にしないと
	# 「台の数だけ上限が増える」ことになる
	store = "memory"

	enabled = true
}

# トレースの出し先（要件 NF-O-05）。
#
# <b>書かなければトレースは出ない。</b>OpsApp が、この値があるときだけ
# JimbleOtel.install(...) を呼ぶ。書いていないのに collector を探しに行くと、
# 起動のたびに接続エラーがログに出る
#
# otel {
#   endpoint = "http://localhost:4318"
# }

<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>jimble batch manager</title>
<style>
:root { color-scheme: light dark; --line:#d0d4da; --bg:#fff; --fg:#1a1d21; --muted:#6b7280; --accent:#2563eb; }
@media (prefers-color-scheme: dark) { :root { --line:#3a4048; --bg:#16191d; --fg:#e6e8ea; --muted:#9aa2ad; --accent:#60a5fa; } }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--fg);
	font:14px/1.6 system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif; }
header { padding:12px 16px; border-bottom:1px solid var(--line); display:flex; gap:16px; align-items:center; flex-wrap:wrap; }
h1 { font-size:15px; margin:0; font-weight:600; }
main { padding:16px; max-width:1200px; }
section { margin-bottom:28px; }
h2 { font-size:14px; margin:0 0 8px; font-weight:600; }
table { border-collapse:collapse; width:100%; font-size:13px; }
th, td { border-bottom:1px solid var(--line); padding:6px 8px; text-align:left; vertical-align:top; }
th { color:var(--muted); font-weight:600; white-space:nowrap; }
td.actions { white-space:nowrap; }
button { font:inherit; font-size:12px; padding:3px 9px; border:1px solid var(--line);
	background:transparent; color:var(--fg); border-radius:4px; cursor:pointer; }
button:hover { border-color:var(--accent); color:var(--accent); }
button:disabled { opacity:.4; cursor:default; }
input[type=text] { font:inherit; font-size:12px; padding:3px 6px; border:1px solid var(--line);
	background:transparent; color:var(--fg); border-radius:4px; width:110px; }
.pill { display:inline-block; padding:1px 8px; border-radius:10px; font-size:12px; border:1px solid var(--line); }
.ok { color:#15803d; border-color:#15803d; }
.ng { color:#b91c1c; border-color:#b91c1c; }
.muted { color:var(--muted); }
pre { background:rgba(127,127,127,.1); padding:10px; border-radius:4px; overflow-x:auto; font-size:12px; }
#message { margin:0; padding:0 16px; font-size:13px; overflow:hidden; max-height:0; transition:max-height .15s; }
#message.shown { padding:8px 16px; max-height:80px; }
#message.ok { color:#15803d; background:rgba(21,128,61,.10); border-bottom:1px solid rgba(21,128,61,.35); }
#message.error { color:#b91c1c; background:rgba(185,28,28,.10); border-bottom:1px solid rgba(185,28,28,.35); }
tr.detail > td { background:rgba(127,127,127,.06); }
tr.detail pre { margin:0; }
td.empty { color:var(--muted); }
td.failed { color:#b91c1c; }
.pager { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:8px; font-size:13px; }
.pager .count { color:var(--muted); }
.pager select { font:inherit; font-size:12px; padding:3px 6px; border:1px solid var(--line);
	background:transparent; color:var(--fg); border-radius:4px; }
details summary { cursor:pointer; }
</style>
</head>
<body>

<header>
	<h1>jimble batch manager</h1>
	<span id="status-batch"></span>
	<span id="status-scheduler"></span>
	<button id="reload">再読み込み</button>
</header>

<div id="message"></div>

<main>

<section>
	<h2>バッチ</h2>
	<table>
		<thead>
			<tr>
				<th>クラス</th><th>名前</th><th>状態</th><th>cron</th><th>同時実行</th><th></th>
			</tr>
		</thead>
		<tbody id="masters"></tbody>
	</table>
</section>

<section>
	<h2>履歴</h2>
	<table>
		<thead>
			<tr>
				<th>ID</th><th>名前</th><th>状態</th><th>開始</th><th>終了</th><th>所要(秒)</th><th></th>
			</tr>
		</thead>
		<tbody id="histories"></tbody>
	</table>
	<div class="pager" id="history-pager"></div>
</section>

</main>

<script>
const BASE = location.pathname.replace(/\/+$/, '');

/* いま出しているメッセージの番号（古いタイマーが新しいものを消さないように） */
let messageSeq = 0;

/**
 * メッセージを出す
 *
 * 成功も出す。以前は reload() の先頭で消していたので、
 * 「保存しました」が出た直後に必ず消えていた。
 */
function say (text, kind) {

	const el = document.getElementById('message');
	const seq = ++messageSeq;

	el.textContent = text || '';
	el.className = text ? ('shown ' + (kind || 'ok')) : '';

	if (!text || kind === 'error') {
		return;
	}

	// 成功は放っておくと居座るので、少ししたら消す
	setTimeout(() => {
		if (seq === messageSeq) {
			say('');
		}
	}, 6000);

}

async function call (path, body) {
	const res = await fetch(BASE + path, {
		method: body === undefined ? 'GET' : 'POST',
		headers: { 'Content-Type': 'application/json' },
		body: body === undefined ? undefined : JSON.stringify(body || {})
	});
	const json = await res.json().catch(() => ({}));
	if (!res.ok) {
		throw new Error(json.error || ('HTTP ' + res.status));
	}
	return json;
}

function text (value) {
	return value === null || value === undefined ? '' : String(value);
}

function pill (label, good) {
	return '<span class="pill ' + (good ? 'ok' : 'ng') + '">' + label + '</span>';
}

function escapeHtml (value) {
	return text(value).replace(/[&<>"']/g, c =>
		({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
}

async function loadStatus () {
	const row = (await call('/api/status')).row;

	document.getElementById('status-batch').innerHTML =
		'バッチ ' + pill(row.batch_enabled ? '稼働' : '停止', row.batch_enabled)
		+ ' <button data-kind="batch" data-enabled="' + (!row.batch_enabled) + '">'
		+ (row.batch_enabled ? '止める' : '動かす') + '</button>'
		+ (row.batch_running ? ' <span class="muted">実行中</span>' : '');

	document.getElementById('status-scheduler').innerHTML =
		'スケジューラ ' + pill(row.scheduler_enabled ? '稼働' : '停止', row.scheduler_enabled)
		+ ' <button data-kind="scheduler" data-enabled="' + (!row.scheduler_enabled) + '">'
		+ (row.scheduler_enabled ? '止める' : '動かす') + '</button>'
		+ (row.scheduler_running ? ' <span class="muted">起動中</span>'
			: ' <span class="muted">起動しているプロセスなし</span>');
}

/**
 * 表に「1行だけのお知らせ」を出す
 *
 * <p>
 * 空のときも失敗したときも、前は<b>ただの空っぽ</b>だった。
 * 「何も出ない」がいちばん困る（原因が分からない）。
 * </p>
 *
 * @param tbody		表の本体
 * @param columns	列数
 * @param message	出す文
 * @param failed	失敗なら true
 */
function notice (tbody, columns, message, failed) {

	tbody.innerHTML = '<tr><td colspan="' + columns + '" class="'
		+ (failed ? 'failed' : 'empty') + '">' + escapeHtml(message) + '</td></tr>';

}

async function loadMasters () {

	const tbody = document.getElementById('masters');
	let rows;

	try {
		rows = (await call('/api/master', { per: 100 })).rows || [];
	} catch (ex) {
		notice(tbody, 6, 'バッチ一覧を読めませんでした: ' + ex.message, true);
		return;
	}

	if (rows.length === 0) {
		notice(tbody, 6,
			'登録されているバッチがありません。'
			+ 'BatchRegistry.add(...) と BatchRegistry.sync(...) を通っているか、'
			+ 'batch_master の status が nothing になっていないかを確認してください。', false);
		return;
	}

	tbody.innerHTML = rows.map(row => {
		const enabled = row.status === 'enable';
		return '<tr>'
			+ '<td><code>' + escapeHtml(row.class_name) + '</code></td>'
			+ '<td>' + escapeHtml(row.name) + '</td>'
			+ '<td>' + pill(enabled ? '有効' : '無効', enabled) + '</td>'
			+ '<td><input type="text" value="' + escapeHtml(row.cron) + '" data-cron="'
				+ escapeHtml(row.class_name) + '"><br>'
				+ '<span class="muted">既定 ' + escapeHtml(row.default_cron || '-') + '</span></td>'
			+ '<td>' + text(row.allow_concurrent_execution) + '</td>'
			+ '<td class="actions">'
				+ '<button data-save="' + escapeHtml(row.class_name) + '">保存</button> '
				+ '<button data-toggle="' + escapeHtml(row.class_name) + '" data-status="'
					+ (enabled ? 'disable' : 'enable') + '">' + (enabled ? '無効' : '有効') + '</button> '
				+ '<button data-run="' + escapeHtml(row.class_name) + '">いま動かす</button>'
			+ '</td>'
			+ '</tr>';
	}).join('');
}

/* 履歴のいまのページ */
let historyPage = 1;

/* 履歴の1ページあたりの件数 */
let historyPer = 20;

async function loadHistories () {

	const tbody = document.getElementById('histories');
	let result;

	try {
		result = await call('/api/history', { page: historyPage, per: historyPer });
	} catch (ex) {
		notice(tbody, 7, '履歴を読めませんでした: ' + ex.message, true);
		document.getElementById('history-pager').innerHTML = '';
		return;
	}

	const rows = result.rows || [];
	const paging = result.paging || {};

	/*
	 * 消えて減ったときに、空のページに取り残されないようにする。
	 * maxPage が 0（1件も無い）ときは 1 ページ目のままにする。
	 */
	if (paging.maxPage >= 1 && historyPage > paging.maxPage) {
		historyPage = paging.maxPage;
		return loadHistories();
	}

	renderHistoryPager(paging);

	if (rows.length === 0) {
		notice(tbody, 7, '履歴がありません', false);
		return;
	}

	tbody.innerHTML = rows.map(row =>
		'<tr>'
		+ '<td>' + row.id + '</td>'
		+ '<td>' + escapeHtml(row.name) + '</td>'
		+ '<td>' + pill(escapeHtml(row.status), row.status === 'completed') + '</td>'
		+ '<td>' + escapeHtml(row.starts_at) + '</td>'
		+ '<td>' + escapeHtml(row.ends_at) + '</td>'
		+ '<td>' + text(row.required_time) + '</td>'
		+ '<td class="actions">'
			+ '<button data-detail="' + row.id + '">詳細</button> '
			+ (row.status === 'in_process'
				? '<button data-cancel="' + row.id + '">中断</button> ' : '')
			+ '<button data-rerun="' + row.id + '">やり直す</button>'
		+ '</td>'
		+ '</tr>'
	).join('');
}

/**
 * 履歴のページャを描く
 *
 * @param paging	サーバーが返したページ情報
 */
function renderHistoryPager (paging) {

	const el = document.getElementById('history-pager');

	const page = paging.page || 1;
	const maxPage = paging.maxPage || 0;
	const total = paging.totalCount || 0;

	if (total === 0) {
		el.innerHTML = '';
		return;
	}

	const first = page <= 1;
	const last = page >= maxPage;

	el.innerHTML =
		'<button data-page="1"' + (first ? ' disabled' : '') + '>&laquo; 最初</button>'
		+ '<button data-page="' + (page - 1) + '"' + (first ? ' disabled' : '') + '>&lsaquo; 前へ</button>'
		+ '<span class="count">' + page + ' / ' + maxPage + ' ページ'
			+ '（' + total + ' 件中 ' + paging.start + '〜' + (paging.start + paging.count - 1) + ' 件）</span>'
		+ '<button data-page="' + (page + 1) + '"' + (last ? ' disabled' : '') + '>次へ &rsaquo;</button>'
		+ '<button data-page="' + maxPage + '"' + (last ? ' disabled' : '') + '>最後 &raquo;</button>'
		+ '<span class="count">表示件数</span>'
		+ '<select id="history-per">'
			+ [20, 50, 100].map(per =>
				'<option value="' + per + '"' + (per === historyPer ? ' selected' : '') + '>'
				+ per + '</option>').join('')
		+ '</select>';

}

document.addEventListener('change', async event => {

	if (event.target.id !== 'history-per') {
		return;
	}

	historyPer = Number(event.target.value);
	historyPage = 1;

	await loadHistories();

});

async function reload () {

	/*
	 * 1つ失敗しても他は出す。
	 * Promise.all だと、1つの失敗で残りの表が空のままになり、
	 * <b>「何も表示されない」だけが残る。</b>
	 */
	const results = await Promise.allSettled([loadStatus(), loadMasters(), loadHistories()]);

	const failed = results.find(result => result.status === 'rejected');

	if (failed) {
		say(String(failed.reason && failed.reason.message || failed.reason), 'error');
	}

}

/**
 * 履歴の詳細を、押した行のすぐ下に出す
 *
 * <p>表の下にまとめて出すと、行が多いときに画面外まで飛ばされる。</p>
 *
 * @param button	押された「詳細」ボタン
 */
async function toggleDetail (button) {

	const tr = button.closest('tr');
	const opened = tr.nextElementSibling;

	// もう開いていれば閉じる
	if (opened && opened.classList.contains('detail')) {
		opened.remove();
		button.textContent = '詳細';
		return;
	}

	// 他に開いているものは閉じる（同時に何枚も出すと表が読めない）
	for (const other of document.querySelectorAll('tr.detail')) {
		other.remove();
	}
	for (const other of document.querySelectorAll('button[data-detail]')) {
		other.textContent = '詳細';
	}

	const row = (await call('/api/history/' + button.dataset.detail)).row;

	const detail = document.createElement('tr');
	detail.className = 'detail';
	detail.innerHTML = '<td colspan="7"><pre>'
		+ escapeHtml(JSON.stringify(row, null, 2)) + '</pre></td>';

	tr.after(detail);
	button.textContent = '閉じる';

}

document.addEventListener('click', async event => {

	const el = event.target.closest('button');
	if (!el) { return; }

	/*
	 * 成功したことを出す。
	 *
	 * ここで say() を呼んでいたのに何も出なかったのは、
	 * このあとの reload() が先頭で say('') していたからである。
	 * いまは reload() のあとに出す。
	 */
	let done = '';

	try {

		if (el.dataset.kind) {
			await call('/api/status/change',
				{ kind: el.dataset.kind, enabled: el.dataset.enabled === 'true' });
			done = '切り替えました';
		} else if (el.dataset.save) {
			const input = document.querySelector('input[data-cron="' + el.dataset.save + '"]');
			await call('/api/master/' + encodeURIComponent(el.dataset.save), { cron: input.value });
			done = 'cron を保存しました: ' + el.dataset.save + ' → ' + input.value;
		} else if (el.dataset.toggle) {
			await call('/api/master/' + encodeURIComponent(el.dataset.toggle) + '/status',
				{ status: el.dataset.status });
			done = (el.dataset.status === 'enable' ? '有効' : '無効') + 'にしました: ' + el.dataset.toggle;
		} else if (el.dataset.run) {
			await call('/api/master/' + encodeURIComponent(el.dataset.run) + '/execute', {});
			done = 'スケジューラに実行を依頼しました: ' + el.dataset.run
				+ '（結果は下の履歴に出ます）';
		} else if (el.dataset.cancel) {
			await call('/api/history/' + el.dataset.cancel + '/cancel', {});
			done = '中断を指示しました: #' + el.dataset.cancel;
		} else if (el.dataset.rerun) {
			await call('/api/history/' + el.dataset.rerun + '/re-execute', {});
			done = 'やり直しを依頼しました: #' + el.dataset.rerun;
		} else if (el.dataset.detail) {
			await toggleDetail(el);
			return;
		} else if (el.dataset.page) {
			// ページ送りは履歴だけ読み直す（全部読み直すと開いている詳細も消える）
			historyPage = Number(el.dataset.page);
			await loadHistories();
			return;
		} else if (el.id === 'reload') {
			// 何もしない（下で再読み込みする）
		} else {
			return;
		}

	} catch (ex) {
		say(ex.message, 'error');
		return;
	}

	await reload();

	if (done) {
		say(done, 'ok');
	}

});

reload();
setInterval(loadStatus, 5000);
</script>

</body>
</html>

# PostgreSQL 結合テスト用の設定（要件 F-D-30）
#
# 開発用 DB に接続する（要件 D-16）。
# 接続先は環境変数で上書きできる。
#
#   JIMBLE_TEST_PG_URL / JIMBLE_TEST_PG_USER / JIMBLE_TEST_PG_PASSWORD
#
# 実行:
#   ./gradlew pgTest

db {
	jimble_test {
		main = true
		product = "postgresql"
		driver = "org.postgresql.Driver"

		url = "jdbc:postgresql://127.0.0.1:5432/jimble_test"
		url = ${?JIMBLE_TEST_PG_URL}

		username = "jimble"
		username = ${?JIMBLE_TEST_PG_USER}

		password = "jimble"
		password = ${?JIMBLE_TEST_PG_PASSWORD}

		maximum_pool_size = 4
		minimum_idle = 1
		idle_timeout = 5m
		max_lifetime = 9m
		connection_timeout = 3s
		fetch_size = 1000
		connection_pool_type = "hikari"

		create_database_sql = "CREATE DATABASE jimble_test"
	}
}

# Redis 結合テスト用。JIMBLE_TEST_REDIS_HOST で上書きできる
redis {
	host = "127.0.0.1"
	host = ${?JIMBLE_TEST_REDIS_HOST}
	port = 6379
}

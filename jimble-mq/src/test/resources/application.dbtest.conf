# DB 結合テスト用の設定
#
# 開発用 DB に接続する（要件 D-16）。
# 接続先は環境変数で上書きできる。
#
#   JIMBLE_TEST_DB_URL / JIMBLE_TEST_DB_USER / JIMBLE_TEST_DB_PASSWORD
#
# 実行:
#   ./gradlew :jimble-db:dbTest

db {
	jimble_test {
		main = true
		driver = "org.mariadb.jdbc.Driver"

		url = "jdbc:mariadb://127.0.0.1:3306/jimble_test?permitMysqlScheme=&useUnicode=true&characterEncoding=UTF-8&characterSetResults=UTF-8&connectionCollation=utf8mb4_bin&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true"
		url = ${?JIMBLE_TEST_DB_URL}

		username = "jimble"
		username = ${?JIMBLE_TEST_DB_USER}

		password = "jimble"
		password = ${?JIMBLE_TEST_DB_PASSWORD}

		maximum_pool_size = 4
		minimum_idle = 1
		idle_timeout = 5m
		max_lifetime = 9m
		connection_timeout = 3s
		fetch_size = 1000
		connection_pool_type = "hikari"

		create_database_sql = "CREATE SCHEMA jimble_test COLLATE utf8mb4_bin"
	}
}

# Redis 結合テスト用。JIMBLE_TEST_REDIS_HOST で上書きできる
redis {
	host = "127.0.0.1"
	host = ${?JIMBLE_TEST_REDIS_HOST}
	port = 6379
}

# MQ 結合テスト用。待ち時間を短くする
mq {
	poll_min = 5ms
	poll_max = 50ms
	retry_backoff = 1s
	retry_backoff_max = 2s
	stale = 2s
	thread_count {
		short_time = 2
	}
}

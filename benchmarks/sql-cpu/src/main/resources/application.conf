# ベンチマーク用の設定。接続先は bench 用の MySQL コンテナだけ（利用者の DB には繋がない）
db {
	bench {
		main = true
		driver = "org.mariadb.jdbc.Driver"
		url = "jdbc:mariadb://127.0.0.1:13306/jimble_test?permitMysqlScheme=&useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_bin&useSSL=false&allowPublicKeyRetrieval=true"
		username = "jimble"
		password = "jimble"
		maximum_pool_size = 4
		minimum_idle = 1
		connection_pool_type = "hikari"
	}
}

sql_cache {
	enabled = true
	store = "memory"
	namespace = "bench"
}

cookie {
	secret = "bench-cookie-secret-0123456789abcdef0123456789abcdef"
	secure = true
	same_site = "lax"
	max_age = 30d
}

server.access_log = false

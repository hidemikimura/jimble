# jimble の CI（要件 F-G-14 / NF-T-06 / NF-T-07 / NF-S-07）
#
# 公開リポジトリなので、標準ランナー（ubuntu-latest）の実行時間は無料である。
# larger runner は使わない。
#
# 3つに分けてある。理由は「落ちたときにどこが悪いか一目で分かる」ため。
#
#   build   DB を一切使わない。ここが落ちたら DB とは無関係の壊れ方である
#   plugin  Gradle プラグイン。本体とは<b>別のビルド</b>なので、ジョブも分ける
#   db      MySQL(MariaDB) + Redis の結合テストと、生成物の鮮度確認
#   pg      PostgreSQL の結合テスト。db と同じテストを製品だけ変えて流す
#
# db と pg を分けているのは、<b>片方だけ落ちたときに「製品差の問題」だと分かる</b>ためである。
# 1つのジョブにまとめると、どちらで落ちたのかログを追わないと分からない。

name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

# 同じブランチに続けて push したら、古いほうは打ち切る
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  # DB を使わないもの。コンパイル・単体テスト・javadoc・ドキュメントサイト
  build:
    name: build（DB なし）
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      # -Werror と doclint が効いているので、警告が1つでも出たらここで落ちる（要件 D-15）
      - name: build（単体テスト・javadoc 込み）
        run: ./gradlew build --stacktrace

      # コード片は examples/ とテストの実コードから抜いている（要件 NF-D-03）。
      # 印が消えていればここで落ちる = ドキュメントの陳腐化を機械で止める
      - name: ドキュメントサイトの生成
        run: ./gradlew site --stacktrace

      # <b>0 ページでも site タスクは成功する。</b>
      # 原稿がクローンに入っていないと、上のステップは通るのに何も作られない
      # （実際、docs/site を .gitignore で外していたあいだ、この確認は空振りしていた）
      - name: 生成されたか確かめる
        run: |
          set -eu
          test -f docs/site/build/ja/index.html
          test -f docs/site/build/en/index.html
          count=$(find docs/site/build -name '*.html' | wc -l)
          echo "HTML: $count ページ"
          test "$count" -ge 70

      - name: テスト結果を残す
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-test-results
          path: '**/build/reports/tests/**'
          retention-days: 7
          if-no-files-found: ignore

  # Gradle プラグイン（本体とは別ビルド）
  #
  # <b>ジョブを分ける。</b>同じ作業ディレクトリで
  # 「ルートの build（gradle-plugin を includeBuild で巻き込む）」と
  # 「-p gradle-plugin の build」を続けて流すと、
  # <b>同じ出力先を2つのビルドが触る</b>ことになり、落ちたときに切り分けられない。
  plugin:
    name: build（Gradle プラグイン）
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: build（テスト・javadoc 込み）
        run: ./gradlew -p gradle-plugin build --stacktrace

      - name: テスト結果を残す
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: plugin-test-results
          path: 'gradle-plugin/build/reports/**'
          retention-days: 7
          if-no-files-found: ignore

  # MySQL(MariaDB) + Redis
  db:
    name: dbTest（MySQL / Redis）
    runs-on: ubuntu-latest
    timeout-minutes: 40

    services:
      mariadb:
        image: mariadb:11.4
        env:
          # jimble はスキーマを自分で作る（create_database_sql）ので、
          # <b>スキーマを作れる権限が要る</b>。CI では root をそのまま使う。
          MARIADB_ROOT_PASSWORD: jimble
          # ランナー本体（コンテナの外）から繋ぐので、localhost だけでは足りない
          MARIADB_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      # URL は上書きしない。
      # <b>examples/blog の application.conf も JIMBLE_TEST_DB_URL を見ている</b>ので、
      # ここで URL を差し替えると blog が jimble_test を向いてしまう。
      # 既定の 127.0.0.1:3306 のままで当たるように、ポートだけ合わせてある。
      JIMBLE_TEST_DB_USER: root
      JIMBLE_TEST_DB_PASSWORD: jimble

    steps:
      - uses: actions/checkout@v4

      - name: Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: dbTest（@Tag("db") のテスト）
        run: ./gradlew dbTest --stacktrace

      # 要件 F-G-14。コミットされている生成物がスキーマと一致するか
      - name: codegenCheck
        run: ./gradlew :examples:blog:codegenCheck --stacktrace

      # 要件 NF-T-07。migrate → codegen → compileJava の連鎖
      - name: migrate → codegen → compileJava の連鎖
        run: ./gradlew :examples:blog:build -Pjimble.autoGenerate=true --stacktrace

      - name: テスト結果を残す
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: db-test-results
          path: '**/build/reports/tests/**'
          retention-days: 7
          if-no-files-found: ignore

  # PostgreSQL。db と同じテストを製品だけ変えて流す（要件 F-D-30）
  pg:
    name: pgTest（PostgreSQL）
    runs-on: ubuntu-latest
    timeout-minutes: 40

    services:
      postgres:
        image: postgres:16-alpine
        env:
          # POSTGRES_USER で作られる利用者はスーパーユーザーなので、
          # CREATE DATABASE がそのまま通る。設定の既定値と同じ名前にしてある
          POSTGRES_USER: jimble
          POSTGRES_PASSWORD: jimble
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U jimble"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - name: Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: pgTest（@Tag("db") のテストを PostgreSQL で）
        run: ./gradlew pgTest --stacktrace

      - name: テスト結果を残す
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pg-test-results
          path: '**/build/reports/tests/**'
          retention-days: 7
          if-no-files-found: ignore

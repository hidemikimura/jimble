# 依存の更新を拾う（要件 NF-S-07）
#
# 脆弱性の警告そのものは Dependency graph（dependency-submission.yml）と
# GitHub の Dependabot alerts に任せる。ここは<b>版が上がったことを知る</b>ためのもの。
#
# 週1にしてあるのは、毎日だと PR が溜まって読まれなくなるからである。

version: 2

updates:

  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # helidon は複数の artifact が同じ版で動くので、1本の PR にまとめる
      helidon:
        patterns:
          - "io.helidon*"
    ignore:
      # helidon は LTS の系列に留める（D-177）。
      #
      # 27.0.0（2026-09）から版番号が JDK に揃った（tip and tail モデル）。
      # <b>Helidon N は JDK N を要る</b>——27 は Java 27 が無いと動かない。
      # jimble の最低線は Java 25 LTS なので、27 を入れると
      # <b>Java 25 で動かしているアプリが全部起動しなくなる</b>。
      #
      # いまの 4.5 は LTS の tail（JDK 21 が最低線、JDK 25 推奨）で、修正はここに来る。
      # 4.x の中の更新（4.5.x / 4.6 …）はこれまでどおり PR になる。
      #
      # 版の範囲（">=5"）ではなく semver-major で止めているのは、
      # <b>次の LTS に移ったあともそのまま効く</b>からである——
      # 29 に上げれば 29.x は通り、30 / 31 は止まる。
      #
      # 次の LTS は Helidon 29（JDK 29）。上げるのは jimble の最低 Java を
      # 29 に上げるときで、それは<b>アプリ全員の実行環境を変える</b>話である。
      # PR が来たから merge する、で通す話ではない。
      - dependency-name: "io.helidon*"
        update-types: [ "version-update:semver-major" ]

  # ワークフローで使う action も古くなる
  #
  # 上限は 5 にしてある。3 だと<b>4本目が来なくなる</b>：
  # checkout / upload-artifact / gradle/actions の3本が開いたままのあいだ、
  # 非推奨になった setup-java v4 の PR がいつまでも出てこなかった。
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      # gradle/actions は v5 で止める（D-118）。
      # v6 でキャッシュ機能が gradle-actions-caching という
      # <b>MIT ではない非公開コンポーネント</b>に切り出され、
      # 「v6 に上げたら Gradle の Terms of Use に同意したことになる」と
      # リリースノートに明記された。Apache-2.0 のプロジェクトなので、
      # <b>PR が来たから merge する</b>で通す話ではない。
      # v5 は「v4 ＋ Node 24」だけで、機能もライセンスも v4 と同じである。
      #
      # 上げるときは、この行を消す前に Terms of Use を読むこと。
      - dependency-name: "gradle/actions"
        versions: [ ">=6" ]

# PostgreSQL 結合テスト用の設定（要件 F-D-30）
#
# application.dbtest.conf と<b>中身は同じ</b>で、繋ぎ先と product だけが違う。
# テストのコードは1行も変えずに、同じ検証を PostgreSQL に対して走らせる。
#
#   JIMBLE_TEST_PG_URL / JIMBLE_TEST_PG_USER / JIMBLE_TEST_PG_PASSWORD
#
# 実行:
#   ./gradlew :jimble-db:pgTest

db {
	jimble_test {
		main = true
		product = "postgresql"
		driver = "org.postgresql.Driver"

		url = "jdbc:postgresql://127.0.0.1:5432/jimble_test"
		url = ${?JIMBLE_TEST_PG_URL}

		username = "jimble"
		username = ${?JIMBLE_TEST_PG_USER}

		password = "jimble"
		password = ${?JIMBLE_TEST_PG_PASSWORD}

		maximum_pool_size = 4
		minimum_idle = 1
		idle_timeout = 5m
		max_lifetime = 9m
		connection_timeout = 3s
		fetch_size = 1000
		connection_pool_type = "hikari"

		create_database_sql = "CREATE DATABASE jimble_test"
	}
}

# Redis 結合テスト用。JIMBLE_TEST_REDIS_HOST で上書きできる
redis {
	host = "127.0.0.1"
	host = ${?JIMBLE_TEST_REDIS_HOST}
	port = 6379
}

# 複数データソース（要件 F-D-14）の結合テスト用
db {
	jimble_test_sub {
		product = "postgresql"
		driver = "org.postgresql.Driver"

		url = "jdbc:postgresql://127.0.0.1:5432/jimble_test_sub"
		url = ${?JIMBLE_TEST_PG_SUB_URL}

		username = "jimble"
		username = ${?JIMBLE_TEST_PG_USER}

		password = "jimble"
		password = ${?JIMBLE_TEST_PG_PASSWORD}

		maximum_pool_size = 2
		minimum_idle = 1
		connection_timeout = 3s
		connection_pool_type = "hikari"

		create_database_sql = "CREATE DATABASE jimble_test_sub"
	}
}

# サブ DB（要件 F-D-14）
db {
	jimble_test {
		subs {
			sub {
				url = "jdbc:postgresql://127.0.0.1:5432/jimble_test_sub"
				url = ${?JIMBLE_TEST_PG_SUB_URL}
				maximum_pool_size = 2
				minimum_idle = 1
			}
		}
	}
}

# DB 結合テスト用の設定
#
# 開発用 DB に接続する（要件 D-16）。
# 接続先は環境変数で上書きできる。
#
#   JIMBLE_TEST_DB_URL / JIMBLE_TEST_DB_USER / JIMBLE_TEST_DB_PASSWORD
#
# 実行:
#   ./gradlew :jimble-web:dbTest

db {
	jimble_test {
		main = true
		driver = "org.mariadb.jdbc.Driver"

		url = "jdbc:mariadb://127.0.0.1:3306/jimble_test?permitMysqlScheme=&useUnicode=true&characterEncoding=UTF-8&characterSetResults=UTF-8&connectionCollation=utf8mb4_bin&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true"
		url = ${?JIMBLE_TEST_DB_URL}

		username = "jimble"
		username = ${?JIMBLE_TEST_DB_USER}

		password = "jimble"
		password = ${?JIMBLE_TEST_DB_PASSWORD}

		maximumPoolSize = 4
		minimumIdle = 1
		idleTimeout = 300000
		maxLifetime = 540000
		connectionTimeout = 3000
		fetchSize = 1000
		connection_pool_type = "hikari"

		create_database_sql = "CREATE SCHEMA jimble_test COLLATE utf8mb4_bin"
	}
}

session {
	store = "db"
	timeout_minutes = 30
	table = "session_test"
}

cookie {
	secure = false
}

# Redis セッションの結合テスト用（要件 F-S-01）
redis {
	host = "127.0.0.1"
	host = ${?JIMBLE_TEST_REDIS_HOST}
	port = 6379
}

# 複数データソースの結合テスト用（要件 F-D-14）
#
# 同じサーバーの別スキーマを「サブDB」として繋ぐ。
# main = true が付いていないものはサブになる。
db {
	jimble_test_sub {
		driver = "org.mariadb.jdbc.Driver"

		url = "jdbc:mariadb://127.0.0.1:3306/jimble_test_sub?permitMysqlScheme=&useUnicode=true&characterEncoding=UTF-8&characterSetResults=UTF-8&connectionCollation=utf8mb4_bin&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true"
		url = ${?JIMBLE_TEST_SUB_DB_URL}

		username = "jimble"
		username = ${?JIMBLE_TEST_DB_USER}

		password = "jimble"
		password = ${?JIMBLE_TEST_DB_PASSWORD}

		maximumPoolSize = 2
		minimumIdle = 1
		connectionTimeout = 3000
		connection_pool_type = "hikari"

		create_database_sql = "CREATE SCHEMA jimble_test_sub COLLATE utf8mb4_bin"
	}
}

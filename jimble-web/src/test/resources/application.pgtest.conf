# PostgreSQL 結合テスト用の設定（要件 F-D-30）
#
# 開発用 DB に接続する（要件 D-16）。
# 接続先は環境変数で上書きできる。
#
#   JIMBLE_TEST_PG_URL / JIMBLE_TEST_PG_USER / JIMBLE_TEST_PG_PASSWORD
#
# 実行:
#   ./gradlew :jimble-web:dbTest

db {
	jimble_test {
		main = true
		product = "postgresql"
		driver = "org.postgresql.Driver"

		url = "jdbc:postgresql://127.0.0.1:5432/jimble_test"
		url = ${?JIMBLE_TEST_PG_URL}

		username = "jimble"
		username = ${?JIMBLE_TEST_PG_USER}

		password = "jimble"
		password = ${?JIMBLE_TEST_PG_PASSWORD}

		maximumPoolSize = 4
		minimumIdle = 1
		idleTimeout = 300000
		maxLifetime = 540000
		connectionTimeout = 3000
		fetchSize = 1000
		connection_pool_type = "hikari"

		create_database_sql = "CREATE DATABASE jimble_test"
	}
}

session {
	store = "db"
	timeout_minutes = 30
	table = "session_test"
}

cookie {
	secure = false
}

# Redis セッションの結合テスト用（要件 F-S-01）
redis {
	host = "127.0.0.1"
	host = ${?JIMBLE_TEST_REDIS_HOST}
	port = 6379
}

# 複数データソースの結合テスト用（要件 F-D-14）
#
# 同じサーバーの別スキーマを「サブDB」として繋ぐ。
# main = true が付いていないものはサブになる。
db {
	jimble_test_sub {
		product = "postgresql"
		driver = "org.postgresql.Driver"

		url = "jdbc:postgresql://127.0.0.1:5432/jimble_test_sub"
		url = ${?JIMBLE_TEST_PG_SUB_URL}

		username = "jimble"
		username = ${?JIMBLE_TEST_PG_USER}

		password = "jimble"
		password = ${?JIMBLE_TEST_PG_PASSWORD}

		maximumPoolSize = 2
		minimumIdle = 1
		connectionTimeout = 3000
		connection_pool_type = "hikari"

		create_database_sql = "CREATE DATABASE jimble_test_sub"
	}
}
